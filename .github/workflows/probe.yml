name: probe
on: { push: { branches: [probe2] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL https://padel-espark23.doinsport.club/home -o h.html; wc -c h.html
          grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' h.html | sort | uniq -c | head
          grep -oiE '.{0,80}(whiteLabel|white-label|clubId|club_id|guid).{0,120}' h.html | head -10
          for js in $(grep -oE 'src="[^"]*\.js"' h.html | sed 's/src="//;s/"$//' | head -8); do case $js in http*) u=$js;; *) u="https://padel-espark23.doinsport.club/$js";; esac; curl -sL "$u" | grep -oE '.{0,80}(white-labels|whiteLabel)[^"]{0,120}' | head -3; done
          echo "=== API tries"
          for q in "clubs/white-labels?domain=padel-espark23.doinsport.club" "clubs/white-labels?name=padel-espark23" "white-labels?domain=padel-espark23.doinsport.club" "clubs?whiteLabel.name=padel-espark23" "clubs?name=espark"; do echo "-- $q"; curl -s -H 'Accept: application/json' "https://api-v3.doinsport.club/$q" | head -c 600; echo; done
