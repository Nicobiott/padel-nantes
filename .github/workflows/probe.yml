name: probe
on: { push: { branches: [probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://www.apex-timing.com/gokarts/session_booking.php?center=66&id=1277"
          for q in "date=2026/11/05" "date=2026-11-05" "selected_date=2026/11/05" "day=2026/11/05" "d=2026/11/05"; do echo "$q -> $(curl -sL "$B&$q" | grep -oE "current_date = '[^']*'")"; done
          echo "=== CANCHA main.asp"; curl -sL https://lacancha.mymobileapp.fr/main.asp | grep -oiE '.{0,160}(reserv|calendrier|myLoad|\.asp).{0,160}' | sort -u | head -30
