name: probe
on: { push: { branches: [probe2] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -H 'Accept: application/json' "https://api-v3.doinsport.club/clubs?name=espark" > c.json
          jq -c '.[] | {id, name, "@id": .["@id"], activities: (.activities // [] | map({id: (.id // .), name: (.name // null)})), timezone, address}' c.json | head -c 3000; echo
          CID=$(jq -r '.[0].id' c.json); echo "CID=$CID"
          curl -s -H 'Accept: application/json' "https://api-v3.doinsport.club/clubs/playgrounds/plannings/2026-11-06?club.id=$CID&from=00:00:00&to=23:59:59&bookingType=unique" > p.json
          jq -c '(if type=="array" then . else .["hydra:member"] end) | .[] | {name, acts: [.activities[]? | {id, name, n: (.slots|length), first: (.slots[0].startAt), sample: (.slots[0].prices[0] | {duration, bookable, pricePerParticipant, participantCount})}]}' p.json | head -c 4000
